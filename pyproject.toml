[project]
name = "ashare-research-platform"
version = "0.1.0"
description = "本地运行的 A 股投研平台：数据、因子、回测"
requires-python = ">=3.11,<3.13"

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "akshare>=1.14",
    "baostock>=0.8.9",
    "streamlit>=1.36",
    "plotly>=5.22",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
